- name: Setup Kubernetes Worker
  hosts: kworker
  become: true

  vars:
    join_file: "./join-command.sh"

  tasks:

    # -------------------------
    # SYSTEM PREP
    # -------------------------
    - name: Disable swap
      command: swapoff -a

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*swap.*)$'
        replace: '# \1'
    - name: Set SELinux to permissive
      command: setenforce 0
      ignore_errors: true

    - name: Disable SELinux permanently
      replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'

    # Kernel modules
    - name: Add kernel modules config
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load modules
      command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter

    # Sysctl
    - name: Set sysctl params
      copy:
        dest: /etc/sysctl.d/kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
    - name: Apply sysctl
      command: sysctl --system
    # -------------------------
    # CONTAINERD
    # -------------------------
    - name: Start containerd
      systemd:
        name: containerd
        state: started
        enabled: true

    # -------------------------
    # KUBERNETES INSTALL
    # -------------------------
    - name: Add Kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key

    - name: Install kube tools
      dnf:
        name:
          - kubelet
          - kubeadm
        state: present

    - name: Enable kubelet
      systemd:
        name: kubelet
        state: started
        enabled: true

    # -------------------------
    # JOIN CLUSTER
    # -------------------------
    - name: Read join command
      set_fact:
        join_command: "{{ lookup('file', join_file) }}"

    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: joined

    - name: Join cluster
      command: "{{ join_command }}"
      when: not joined.stat.exists

    # -------------------------
    # CLEANUP (run once)
    # -------------------------
    - name: Delete join command locally
      file:
        path: "{{ join_file }}"
        state: absent
      delegate_to: localhost
      run_once: true
