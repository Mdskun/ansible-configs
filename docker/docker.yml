---
- name: Install Docker + containerd on RHEL (8/9/10 with fixes)
  hosts: all
  become: true

  vars:
    docker_user: ec2-user   # 🔥 CHANGE THIS or pass via --extra-vars

  tasks:

    # ✅ (Docker docs) Remove old versions
    - name: Remove old Docker versions
      dnf:
        name:
          - docker
          - docker-client
          - docker-client-latest
          - docker-common
          - docker-latest
          - docker-latest-logrotate
          - docker-logrotate
          - docker-engine
          - podman
          - runc
        state: absent
      ignore_errors: true

    - name: Install required tools
      dnf:
        name:
          - dnf-plugins-core
        state: present

    - name: Add Docker repo
      command: >
        dnf config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Enable Docker stable repo
      command: dnf config-manager --enable docker-ce-stable

    # ✅ Install Docker + containerd
    - name: Install Docker packages
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # 🔥 Kernel modules
    - name: Install kernel modules
      dnf:
        name:
          - kernel-modules
          - kernel-modules-extra
        state: present

    - name: Load overlay module
      command: modprobe overlay
      ignore_errors: true

    - name: Load br_netfilter module
      command: modprobe br_netfilter
      ignore_errors: true

    - name: Persist kernel modules
      copy:
        dest: /etc/modules-load.d/docker.conf
        content: |
          overlay
          br_netfilter

    # 🔥 Sysctl
    - name: Configure sysctl for Docker
      copy:
        dest: /etc/sysctl.d/docker.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl
      command: sysctl --system

    # 🔥 Containerd config
    - name: Create containerd config dir
      file:
        path: /etc/containerd
        state: directory

    - name: Generate default containerd config
      command: containerd config default
      register: containerd_config
      changed_when: false

    - name: Write containerd config
      copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_config.stdout }}"

    - name: Enable systemd cgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    # 🔥 RHEL 10 workaround
    - name: Disable Docker iptables (only for RHEL 10)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "iptables": false
          }
      when: ansible_distribution_major_version | int >= 10

    # 🔥 Start Docker
    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    # ✅ Add variable user to docker group
    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
      when: docker_user is defined

    # ✅ Verify Docker
    - name: Test Docker
      command: docker run hello-world
      register: docker_test
      ignore_errors: true

    - debug:
        msg: "{{ docker_test.stdout }}"