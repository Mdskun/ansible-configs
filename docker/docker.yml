- name: Install Docker (RHEL 9/10 clean)
  hosts: all
  become: true

  vars:
    docker_user: ec2-user

  tasks:
    - name: Remove Podman and conflicting packages
      dnf:
        name:
          - podman
          - podman-docker
          - buildah
          - skopeo
        state: absent
      ignore_errors: true
    # Remove old versions
    - name: Remove old Docker
      dnf:
        name:
          - docker
          - docker-client
          - docker-common
          - docker-engine
        state: absent
      ignore_errors: true

    - name: Install dnf tools
      dnf:
        name: dnf-plugins-core
        state: present

    - name: Add Docker repo
      command: >
        dnf config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes

    - name: Verify Docker
      command: docker run hello-world
      register: docker_test
      ignore_errors: true

    - debug:
        msg: "{{ docker_test.stdout }}"