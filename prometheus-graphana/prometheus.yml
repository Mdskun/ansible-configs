---
- name: Prometheus installation (manual setup)
  hosts: all
  become: true

  vars:
    link: "https://github.com/prometheus/prometheus/releases/download/v3.11.3/prometheus-3.11.3.linux-amd64.tar.gz"
    install_dir: /tmp/prometheus

  tasks:

    - name: Download Prometheus
      get_url:
        url: "{{ link }}"
        dest: /tmp/prometheus.tar.gz
        mode: '0644'

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install firewalld
      yum:
        name: firewalld
        state: present

    - name: Start and enable firewalld
      systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Open port 9090
      firewalld:
        port: 9090/tcp
        permanent: true
        state: enabled
        immediate: yes

    - name: Create Prometheus user
      user:
        name: prometheus
        shell: /sbin/nologin
        create_home: false

    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Copy Prometheus binary
      copy:
        src: "/tmp/prometheus-3.11.3.linux-amd64/prometheus"
        dest: /usr/local/bin/prometheus
        mode: '0755'
        remote_src: yes

    - name: Copy Promtool binary
      copy:
        src: "/tmp/prometheus-3.11.3.linux-amd64/promtool"
        dest: /usr/local/bin/promtool
        mode: '0755'
        remote_src: yes

    - name: Copy config file
      copy:
        src: "/tmp/prometheus-3.11.3.linux-amd64/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        remote_src: yes

    - name: Set ownership
      file:
        path: "{{ item }}"
        owner: prometheus
        group: prometheus
        recurse: true
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Copy service file
      copy:
        src: prometheus.service
        dest: /etc/systemd/system/prometheus.service

    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Start Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: true