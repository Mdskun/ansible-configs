---
- name: "Manual Graphana installation"
  hosts: all
  become: true
  vars:
    grafana_repo_path: /etc/yum.repos.d/grafana.repo

  tasks:
    - name: Import Grafana GPG key
      rpm_key:
        state: present
        key: https://rpm.grafana.com/gpg.key

    - name: Add Grafana repository
      copy:
        dest: "{{ grafana_repo_path }}"
        content: |
          [grafana]
          name=grafana
          baseurl=https://rpm.grafana.com
          repo_gpgcheck=1
          enabled=1
          gpgcheck=1
          gpgkey=https://rpm.grafana.com/gpg.key
          sslverify=1
          sslcacert=/etc/pki/tls/certs/ca-bundle.crt

    - name: Install Grafana Enterprise
      dnf:
        name: grafana-enterprise
        state: present
    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Enable and start Grafana service
      systemd:
        name: grafana-server
        enabled: yes
        state: started

    - name: Open Grafana port (3000) in firewall
      firewalld:
        port: 3000/tcp
        permanent: yes
        state: enabled
        immediate: yes